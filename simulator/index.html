<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProtonLink simulator</title><style>
*{box-sizing:border-box}body{margin:0;background:#181b1e;color:#e9e9e9;font:16px system-ui;text-align:center;padding:16px}h1{font-size:22px;letter-spacing:3px}#watch{width:min(410px,96vw);aspect-ratio:410/502;margin:auto;background:#000;border:7px solid #53595c;border-radius:44px;overflow:hidden;display:grid;grid-template-rows:10% 77% 13%;padding:0 5%;container-type:inline-size}header,footer{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;border-bottom:1px solid #292e30}footer{border:0;border-top:1px solid #292e30}main{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px 0;justify-content:safe center}button,select{background:#1b2023;color:#eee;border:1px solid #3f484c;border-radius:9px;padding:10px;cursor:pointer;font:inherit;min-height:40px}button:disabled{opacity:.4}header button,footer button{font-size:12px;padding:5px;min-height:32px}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{min-height:60px}.green{background:#173b27;color:#8df1ad}.red{background:#471d20;color:#ff9797}.amber{color:#f3be6c}.dim{color:#9ba4a8;font-size:13px}.big{font-size:clamp(22px,8vw,46px);color:#f3be6c}.face{touch-action:none;overflow:hidden}.gauge{width:min(66cqw,240px);aspect-ratio:1;margin:auto;border-radius:50%;display:grid;place-content:center;border:9px double #8d703d;background:#101415;font-size:56px;color:#edbd74;flex-shrink:0}.gauge.warn{border-color:#e34842}.clock{font-size:42px}.outside{max-width:410px;margin:18px auto;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}#note{min-height:24px;color:#aab2b5;font-size:13px}input[type=range]{width:100%;accent-color:#e3ae60}button:focus-visible{outline:3px solid #efb85f}
</style><h1>PROTON<span style="color:#ee5348">LINK</span></h1><div id="watch"><header id="head"></header><main id="body"></main><footer id="foot"></footer></div><div id="note">Simulation only · hold the face 2 seconds, release, then swipe left.</div><div class="outside"><label for="scenario">Simulate condition</label><select id="scenario"><option>standby</option><option>active</option><option>firing</option><option>warning</option><option>critical</option><option>venting</option><option>offline</option></select></div><script type="module">
import {initial,dispatch,streams,themes} from './model.js';
let s=initial(),page="field",armed=false,hold=null,expiry=null,idle=null,start=null,readyRelease=false,swipe=null;
const $=id=>document.getElementById(id),b=(label,act,cls="")=>'<button class="'+cls+'" data-act="'+act+'">'+label+'</button>',go=(label,p)=>b(label,"go:"+p),row=(...items)=>'<div class="row">'+items.join("")+'</div>',title=t=>'<div class="amber">'+t+'</div>',note=t=>$("note").textContent=t;
function lock(){clearTimeout(hold);clearTimeout(expiry);clearTimeout(idle);hold=null;armed=false;readyRelease=false;start=null;swipe=null;s=dispatch(s,{type:"lock"});page="field";render()}
function activity(){clearTimeout(idle);if(!s.locked)idle=setTimeout(lock,30000)}
function render(){
 const f=s.locked; if(f)page="field";
 $("head").innerHTML=f?'<span style="color:'+(s.online?'#72e6a0':'#ff8585')+'">● '+(s.online?'LINK':'OFFLINE')+'</span><span>PROTONLINK</span>':go("▦","home")+title(page.toUpperCase())+b("LOCK","lock");
 $("body").className=f?"face":"";
 let h="";
 switch(page){
 case "field":h='<div class="clock">'+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})+'</div><div class="gauge '+(["Warning","Critical"].includes(s.cyclotron)?"warn":"")+'">'+(s.online?(s.pack?s.level:"0"):"—")+'</div>'+title(s.online?(s.pack?s.cyclotron:"STANDBY"):"UNKNOWN")+row('<span>♫ '+(s.online&&s.playing?String(s.track-s.first+1).padStart(2,"0"):"—")+'</span>','<span>🔒</span>');break;
 case "home":h='<div class="grid">'+["pack","music","mixer","effects","diagnostics","settings"].map(p=>go(p.toUpperCase(),p)).join("")+'</div>';break;
 case "pack":h=title(s.pack?"PACK ACTIVE":"STANDBY")+'<div class="big">◉</div>'+b(s.pack?"SHUT DOWN":"ACTIVATE","power",s.pack?"red":"green")+row(go(s.theme,"themes"),go(s.stream,"streams"));break;
 case "music":h=title(s.playing?(s.paused?"PAUSED":"PLAYING"):"STOPPED")+'<div class="big">TRACK '+String(s.track-s.first+1).padStart(2,"0")+'</div>'+row(b("▶ START","play","green"),b("■ STOP","stop","red"))+row(b("⏮","prev"),b(s.paused?"RESUME":"PAUSE","pause"),b("⏭","next"))+row(b(s.loop?"REPEAT ONE":"REPEAT ALL","loop"),b("SHUFFLE "+(s.shuffle?"ON":"OFF"),"shuffle"))+go("TRACK LIBRARY","library");break;
 case "library":h=Array.from({length:s.last-s.first+1},(_,i)=>b("Track "+(i+1)+" · ID "+(s.first+i),"track:"+(s.first+i),s.track===s.first+i?"green":"")).join("");break;
 case "mixer":h=["master","effects","music"].map(k=>title(k.toUpperCase()+" "+s[k]+"%")+row(b("−","vol:"+k+":-5"),b("+","vol:"+k+":5"))).join("")+b(s.muted?"UNMUTE":"MUTE","mute");break;
 case "effects":h=row(b("SMOKE "+(s.smoke?"ON":"OFF"),"smoke"),b("VIBRATION "+(s.vibration?"ON":"OFF"),"vibration"))+row(b("VENT","vent"),b(s.direction?"CW":"CCW","direction"))+row(go("STREAMS","streams"),go("THEMES","themes"));break;
 case "streams":h=streams.map(k=>b(k,"stream:"+k,s.stream===k?"green":"")).join("");break;
 case "themes":h=themes.map(k=>b(k,"theme:"+k,s.theme===k?"green":"")).join("");break;
 case "diagnostics":h=Object.entries({Pack:s.pack?"Powered":"Idle",Wand:s.wand?"Connected":"Disconnected",Cable:s.cable?"Connected":"Disconnected",Cyclotron:s.cyclotron,Temperature:s.temperature,Firing:s.firing?"Firing":"Idle"}).map(([k,v])=>row('<span class="dim">'+k+'</span>','<span>'+v+'</span>')).join("");break;
 case "settings":h=title("Offline prototype")+'<p>Gen 1 Attenuator target. Network, workshop, presets and voice are planned.</p>'+b("RETURN TO FIELD LOCK","lock");break;
 }
 $("body").innerHTML=h;
 $("foot").innerHTML=f?'<span></span><span class="amber">'+(armed?"← SWIPE LEFT":"HOLD TO UNLOCK")+'</span><span></span>':go("HOME","home")+go("MUSIC","music")+go("PACK","pack");
}
$("watch").addEventListener("click",e=>{const a=e.target.closest("button")?.dataset.act;if(!a||s.locked)return;activity();let [type,v,d]=a.split(":");if(type==="go"){page=v;render();return}if(type==="lock"){lock();return}let intent={type,value:v};if(type==="track")intent.value=Number(v);if(type==="vol")intent={type:"volume",channel:v,value:s[v]+Number(d)};if(["power","smoke","vent"].includes(type)){intent.value=type==="power"?!s.pack:!s.smoke;intent.confirmed=confirm("Simulate "+type+" change?");if(!intent.confirmed)return}const old=s;s=dispatch(s,intent);note(s===old?"No change · command unavailable":"Simulated "+type);render()});
$("watch").addEventListener("pointerdown",e=>{if(!s.locked||!s.online)return;if(armed&&readyRelease){swipe={x:e.clientX,y:e.clientY};e.currentTarget.setPointerCapture(e.pointerId);return}if(armed)return;start={x:e.clientX,y:e.clientY};e.currentTarget.setPointerCapture(e.pointerId);note("Keep holding…");hold=setTimeout(()=>{hold=null;armed=true;readyRelease=false;render();note("Release, then swipe left within 5 seconds");expiry=setTimeout(lock,5000)},2000)});
$("watch").addEventListener("pointermove",e=>{if(hold&&start&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>15){clearTimeout(hold);hold=null;note("Hold cancelled")}});
$("watch").addEventListener("pointerup",e=>{if(hold){clearTimeout(hold);hold=null;note("Hold for 2 seconds")}if(armed&&swipe&&swipe.x-e.clientX>45&&Math.abs(swipe.y-e.clientY)<65){clearTimeout(expiry);armed=false;readyRelease=false;s=dispatch(s,{type:"unlock"});page="home";activity();note("Controls unlocked");render()}else if(armed)readyRelease=true;swipe=null;start=null});
$("watch").addEventListener("pointercancel",()=>{if(s.locked)lock()});
$("scenario").addEventListener("change",e=>{s=dispatch(s,{type:"scenario",value:e.target.value});if(s.locked)lock();else render();note("Simulated "+e.target.value)});
document.addEventListener("visibilitychange",()=>{if(document.hidden)lock()});
render();setInterval(()=>{if(s.locked&&!hold&&!armed)render()},30000);
</script></html>
