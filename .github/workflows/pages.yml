name: Simulator regression tests
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check simulator/model.js && node --check simulator/cases.js && node --check simulator/protocol.js && node --check simulator/lab.js && node --check simulator/volume.js && node --check simulator/faces.js && node --check simulator/library.js && node --check simulator/quick.js && node --check simulator/reliability.js
      - name: Verify branch-published entry point and module paths
        run: |
          test -f .nojekyll
          grep -q 'url=./simulator/' index.html
          python -c "import re; from pathlib import Path; p=Path('simulator'); files=[p/'index.html', *p.glob('*.js')]; missing=[str(f)+': '+m for f in files for m in re.findall(r'''from\s+['\"](\./[^'\"]+)['\"]''',f.read_text()) if not (p/m).is_file()]; assert not missing, missing"
      - name: Check browser module syntax
        run: |
          python -c "from pathlib import Path; s=Path('simulator/index.html').read_text(); Path('simulator/.check.mjs').write_text(s.split('<script type=\"module\">')[1].split('</script>')[0])"
          node --check simulator/.check.mjs
          rm simulator/.check.mjs
      - name: Browser smoke tests
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
          npx playwright test tests/browser.spec.mjs --workers=1
