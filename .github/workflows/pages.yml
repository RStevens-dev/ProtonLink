name: Test and deploy simulator
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check simulator/model.js && node --check simulator/cases.js && node --check simulator/protocol.js && node --check simulator/lab.js && node --check simulator/volume.js && node --check simulator/faces.js && node --check simulator/library.js && node --check simulator/quick.js
      - name: Check browser module syntax
        run: |
          python -c "from pathlib import Path; s=Path('simulator/index.html').read_text(); Path('simulator/.check.mjs').write_text(s.split('<script type=\"module\">')[1].split('</script>')[0])"
          node --check simulator/.check.mjs
          rm simulator/.check.mjs
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage static simulator only
        run: |
          mkdir -p _site
          cp simulator/index.html simulator/model.js simulator/cases.js simulator/protocol.js simulator/lab.js simulator/volume.js simulator/faces.js simulator/library.js simulator/quick.js _site/
          if [ -f assets/branding/ProtonLink.png ]; then cp assets/branding/ProtonLink.png _site/branding.png; fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
          retention-days: 3
      - name: Wait for uploaded Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --paginate --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\" and .expired == false) | .id" 2>/tmp/pages-artifact-error); then
              if [[ -n "$id" ]]; then
                echo "Artifact $ARTIFACT_NAME visible: $id"
                exit 0
              fi
            else
              cat /tmp/pages-artifact-error
            fi
            echo "Artifact not yet visible ($attempt/18)"
            sleep 5
          done
          echo "::error::Uploaded Pages artifact is not visible to the Actions API. Check actions: read permission and GitHub service status."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
