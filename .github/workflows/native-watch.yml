name: Native watch build
on:
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/native-watch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.3
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd firmware
          idf.py set-target esp32s3
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: protonlink-watch-build
          path: |
            firmware/build/*.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json
